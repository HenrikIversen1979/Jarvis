<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jarvis</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="stage">
      <canvas id="orb" aria-label="Jarvis voice visualizer"></canvas>

      <section class="hud">
        <p id="status" class="status">Tap to wake Jarvis</p>
        <p id="transcript" class="transcript" aria-live="polite"></p>
      </section>

      <div class="controls">
        <button id="mic" class="mic" aria-label="Hold to speak">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3z"/>
            <path d="M19 11a1 1 0 1 0-2 0 5 5 0 1 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21a1 1 0 1 0 2 0v-3.08A7 7 0 0 0 19 11z"/>
          </svg>
        </button>
      </div>
    </main>

    <div id="gate" class="gate">
      <button id="gate-btn" class="gate-btn">Wake Jarvis</button>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
